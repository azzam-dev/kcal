name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when the same branch is pushed again; only the newest
# commit's result matters and CI minutes are finite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # Next 16 does not run ESLint during `next build`, so lint has to be its
      # own step or it is not enforced anywhere.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Build last: it is the slowest step, and the three above catch most
      # failures faster.
      #
      # The NEXT_PUBLIC_* values below are deliberate placeholders, not the real
      # project's. src/lib/env.ts throws at import when they are missing, and a
      # build has to get past that to prove the app compiles and prerenders.
      # Placeholders keep this job hermetic: it never reaches the live project,
      # and its output is never deployed — Vercel builds separately with the
      # real values. Anything that needs a real database is an integration test,
      # and those skip themselves when credentials are absent.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3001

      # Blocks on critical advisories only. A high-severity advisory in a
      # transitive dependency with no published fix would otherwise halt all
      # work on the repo for something we cannot act on.
      - name: Audit dependencies
        run: npm audit --audit-level=critical
